[project]
name = "llm-library"
version = "0.1.0"
description = "A minimal language-model library built from first principles"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "einops>=0.8",
    "numpy>=2.4",
    "regex>=2026.3.32",
    "torch~=2.11.0",
]

[dependency-groups]
dev = [
    "jaxtyping>=0.3",
    "psutil>=7",
    "pytest>=9.0",
    "pytest-timeout",
    "ruff>=0.15.8",
    "tiktoken>=0.12.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "llm_library"
module-root = "src"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "WARNING"
addopts = "-s"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["UP"]
ignore = ["F722"]

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["E402", "F401", "F403", "E501"]
